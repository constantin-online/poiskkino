<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История просмотров</title>
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    <link rel="shortcut icon" href="favicons/favicon.ico">
    <meta name="theme-color" content="#4285f4">
    
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #202124;
            --text-secondary: #5f6368;
            --card-bg: #fff;
            --card-border: #dfe1e5;
            --card-shadow: rgba(0,0,0,0.15);
            --card-hover-shadow: rgba(0,0,0,0.2);
            --poster-bg: #f0f0f0;
            --link-color: #1a0dab;
            --no-poster-color: #999;
        }

        body.dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #e8eaed;
            --text-secondary: #9aa0a6;
            --card-bg: #202124;
            --card-border: #3c4043;
            --card-shadow: rgba(0,0,0,0.4);
            --card-hover-shadow: rgba(0,0,0,0.6);
            --poster-bg: #303134;
            --link-color: #8ab4f8;
            --no-poster-color: #9aa0a6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }

        .top-buttons {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .icon-btn {
            background: #4285f4;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover { background: #3367d6; transform: scale(1.05); }
        .icon-btn svg { width: 24px; height: 24px; fill: #fff; }

        .container { max-width: 1400px; margin: 0 auto; padding-top: 80px; }
        h1 { color: var(--text-color); font-size: 28px; margin-bottom: 30px; padding-left: 60px; }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .history-item {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 12px;
            overflow: hidden;
            background: var(--card-bg);
            box-shadow: 0 2px 8px var(--card-shadow);
            border: 1px solid var(--card-border);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .history-item:hover { transform: translateY(-4px); box-shadow: 0 8px 16px var(--card-hover-shadow); }

        .history-poster {
            width: 70px;
            height: 100px;
            overflow: hidden;
            background: var(--poster-bg);
            border-radius: 4px;
            margin-bottom: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .no-poster { color: var(--no-poster-color); font-size: 10px; text-align: center; padding: 5px; }
        .history-info { text-align: center; width: 100%; }
        .history-title { color: var(--link-color); font-size: 13px; font-weight: bold; margin-bottom: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .history-title:hover { text-decoration: underline; }
        .history-year { color: var(--text-secondary); font-size: 12px; }
        .empty-history { text-align: center; padding: 50px; color: var(--text-secondary); font-size: 16px; grid-column: 1 / -1; }

        @media (max-width: 1200px) { .history-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
        @media (max-width: 768px) {
            body { padding: 15px; }
            .top-buttons { top: 15px; left: 15px; }
            .icon-btn { width: 45px; height: 45px; }
            .icon-btn svg { width: 20px; height: 20px; }
            .container { padding-top: 70px; }
            h1 { font-size: 24px; padding-left: 50px; }
            .history-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .history-poster { width: 60px; height: 85px; }
            .history-title { font-size: 12px; }
            .history-year { font-size: 11px; }
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .top-buttons { top: 10px; left: 10px; }
            .icon-btn { width: 40px; height: 40px; }
            .icon-btn svg { width: 18px; height: 18px; }
            .container { padding-top: 60px; }
            h1 { font-size: 20px; padding-left: 45px; margin-bottom: 20px; }
            .history-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .history-item { padding: 8px; }
            .history-poster { width: 50px; height: 70px; margin-bottom: 8px; }
            .history-title { font-size: 11px; margin-bottom: 4px; }
            .history-year { font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="top-buttons">
        <a href="index.html" class="icon-btn" title="На главную">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <button class="icon-btn" id="themeToggle" title="Переключить тему">
            <svg id="themeIcon" viewBox="0 0 24 24">
                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
        </button>
    </div>

    <div class="container">
        <h1>История просмотров</h1>
        <div class="history-grid" id="historyList"></div>
    </div>

    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                updateThemeIcon(true);
            }
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
            } else {
                icon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        });

        initTheme();

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('movieHistory') || '[]');
            const container = document.getElementById('historyList');

            if (history.length === 0) {
                container.innerHTML = '<div class="empty-history">История просмотров пуста. Начните искать фильмы!</div>';
                return;
            }

            const displayHistory = history.slice(0, 60);
            let html = '';
            displayHistory.forEach(item => {
                const poster = item.poster || '';
                const year = item.year || '';
                let posterHtml;
                if (poster && poster.trim() !== '') {
                    posterHtml = `<div class="history-poster"><img src="${poster}" alt="${item.name}" onerror="this.parentElement.innerHTML='<div class=\\'no-poster\\'>Нет<br>постера</div>'"></div>`;
                } else {
                    posterHtml = `<div class="history-poster"><div class="no-poster">Нет<br>постера</div></div>`;
                }
                html += `<div class="history-item" onclick="openMovie('${item.token}')">${posterHtml}<div class="history-info"><div class="history-title">${item.name}</div>${year ? `<div class="history-year">${year}</div>` : ''}</div></div>`;
            });
            container.innerHTML = html;
        }

        function openMovie(token) {
            window.open(`result.html?token=${token}`, '_blank');
        }

        loadHistory();
    </script>
</body>
</html>
