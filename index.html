<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск Кино</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    <link rel="shortcut icon" href="favicons/favicon.ico">
    <meta name="theme-color" content="#4285f4">
    
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #202124;
            --text-secondary: #5f6368;
            --border-color: #dfe1e5;
            --hover-bg: #f8f9fa;
            --link-color: #1a0dab;
            --btn-bg: #f8f9fa;
            --btn-border: #f8f9fa;
            --btn-hover-border: #dadce0;
            --shadow-color: rgba(32, 33, 36, 0.28);
        }

        body.dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #e8eaed;
            --text-secondary: #9aa0a6;
            --border-color: #3c4043;
            --hover-bg: #2a2a2a;
            --link-color: #8ab4f8;
            --btn-bg: #303134;
            --btn-border: #303134;
            --btn-hover-border: #5f6368;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-color);
            color: var(--text-color);
            padding-top: 15vh;
            transition: background 0.3s, color 0.3s;
        }

        /* Фиксированные позиции кнопок */
        .nav-left {
            position: fixed;
            left: 20px;
            top: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .nav-right {
            position: fixed;
            right: 20px;
            top: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .nav-link {
            background: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-link:hover { background: var(--hover-bg); border-color: var(--btn-hover-border); }

        .icon-btn {
            background: #4285f4;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover { background: #3367d6; transform: scale(1.05); }
        .icon-btn svg { width: 24px; height: 24px; fill: #fff; }

        .logo {
            font-size: 90px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: -3px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .logo:hover { opacity: 0.8; }
        .logo span:nth-child(1) { color: #4285f4; }
        .logo span:nth-child(2) { color: #ea4335; }
        .logo span:nth-child(3) { color: #fbbc05; }
        .logo span:nth-child(4) { color: #4285f4; }
        .logo span:nth-child(5) { color: #34a853; }
        .logo span:nth-child(6) { color: #ea4335; }

        .search-container { width: 100%; max-width: 584px; padding: 0 20px; }

        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 10px 20px;
            margin-bottom: 10px;
            transition: box-shadow 0.3s;
            background: var(--bg-color);
        }

        .search-box:hover, .search-box:focus-within { box-shadow: 0 1px 6px var(--shadow-color); }
        .search-box input {
            flex: 1; border: none; outline: none; font-size: 16px; padding: 8px;
            background: transparent; color: var(--text-color);
        }

        .search-btn {
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            border-radius: 4px; color: var(--text-color); cursor: pointer;
            font-size: 14px; margin: 11px 4px; padding: 0 16px;
            height: 36px; min-width: 54px; transition: all 0.2s;
        }

        .search-btn:hover {
            box-shadow: 0 1px 1px var(--shadow-color);
            border: 1px solid var(--btn-hover-border);
        }

        .search-hint {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 15px;
            min-height: 18px;
        }

        .search-hint .hint-type {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            font-weight: bold;
            margin-left: 5px;
        }

        .loading { display: none; margin-top: 20px; color: var(--text-secondary); text-align: center; }

        .results { width: 100%; max-width: 650px; margin-top: 30px; padding: 0 20px; }

        .result-item {
            padding: 15px; border-bottom: 1px solid var(--border-color);
            cursor: pointer; transition: background 0.2s;
        }

        .result-item:hover { background: var(--hover-bg); }

        .result-title {
            color: var(--link-color); font-size: 20px; text-decoration: none;
            display: block; margin-bottom: 5px;
        }

        .result-title:hover { text-decoration: underline; }
        .result-meta { color: var(--text-secondary); font-size: 14px; line-height: 1.4; }
        .result-poster { float: left; margin-right: 15px; margin-bottom: 10px; }
        .result-poster img { width: 80px; height: 120px; object-fit: cover; border-radius: 4px; }
        .clear-float { clear: both; }

        .search-mode-badge {
            display: inline-block; padding: 4px 12px; border-radius: 12px;
            font-size: 12px; font-weight: bold; margin-bottom: 10px;
        }

        .mode-name { background: #e8f0fe; color: #1967d2; }
        .mode-kp { background: #fce8e6; color: #c5221f; }
        .mode-imdb { background: #fef7e0; color: #b06000; }

        body.dark-theme .mode-name { background: #1a3a6b; color: #8ab4f8; }
        body.dark-theme .mode-kp { background: #5c1a1a; color: #f28b82; }
        body.dark-theme .mode-imdb { background: #5c4a1a; color: #fdd663; }

        @media (max-width: 768px) {
            body { padding-top: 10vh; }
            .logo { font-size: 60px; margin-bottom: 20px; }
            .search-container { padding: 0 15px; }
            .search-box { padding: 8px 15px; }
            .search-box input { font-size: 14px; }
            .search-btn { font-size: 13px; padding: 0 12px; }
            .result-title { font-size: 18px; }
            .result-poster img { width: 60px; height: 90px; }
            .icon-btn { width: 45px; height: 45px; }
            .icon-btn svg { width: 20px; height: 20px; }
            .nav-left { left: 15px; top: 15px; }
            .nav-right { right: 15px; top: 15px; }
            .nav-link { font-size: 12px; padding: 6px 12px; }
        }

        @media (max-width: 480px) {
            body { padding-top: 8vh; }
            .logo { font-size: 45px; letter-spacing: -2px; }
            .search-container { padding: 0 10px; }
            .search-box { padding: 6px 12px; border-radius: 20px; }
            .search-box input { font-size: 13px; padding: 6px; }
            .search-btn { font-size: 12px; padding: 0 10px; height: 32px; }
            .result-item { padding: 10px; }
            .result-title { font-size: 16px; }
            .result-meta { font-size: 12px; }
            .result-poster { margin-right: 10px; }
            .result-poster img { width: 50px; height: 75px; }
            .icon-btn { width: 40px; height: 40px; }
            .icon-btn svg { width: 18px; height: 18px; }
            .nav-left { left: 10px; top: 10px; gap: 6px; }
            .nav-right { right: 10px; top: 10px; gap: 6px; }
            .nav-link { font-size: 11px; padding: 5px 10px; }
        }
    </style>
</head>
<body>
    <!-- Слева: Новинки и Категории -->
    <div class="nav-left">
        <a href="new.html" class="nav-link">🔥 Новинки</a>
        <a href="categories.html" class="nav-link">📂 Категории</a>
    </div>

    <!-- Справа: Тема и История -->
    <div class="nav-right">
        <button class="icon-btn" id="themeToggle" title="Переключить тему">
            <svg id="themeIcon" viewBox="0 0 24 24">
                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
        </button>
        <a href="history.html" class="icon-btn" title="История просмотров">
            <svg viewBox="0 0 24 24">
                <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
            </svg>
        </a>
    </div>

    <div class="logo" onclick="resetSearch()">
        <span>П</span><span>о</span><span>и</span><span>с</span><span>к</span><span>&nbsp;Кино</span>
    </div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Название, ID Кинопоиска или IMDB..." autofocus>
        </div>
        <div class="search-hint" id="searchHint">Например: Матрица, 251733 или tt0133093</div>
        <div style="text-align: center;">
            <button class="search-btn" onclick="searchMovie()">Поиск</button>
        </div>
        <div class="loading" id="loading">Поиск...</div>
    </div>

    <div class="results" id="results"></div>

    <script>
        const API_TOKEN = '31bc371dadca00f9f9475a36967d00';
        const API_BASE = 'https://apbugall.org';

        function detectSearchType(query) {
            const trimmed = query.trim();
            if (/^tt\d+$/i.test(trimmed)) return { type: 'imdb', value: trimmed.toLowerCase() };
            if (/^\d+$/.test(trimmed) && trimmed.length >= 5 && trimmed.length <= 8) return { type: 'kp', value: parseInt(trimmed) };
            return { type: 'name', value: trimmed };
        }

        function getSearchModeLabel(type) {
            const labels = {
                'name': { text: 'По названию', class: 'mode-name' },
                'kp': { text: 'ID Кинопоиска', class: 'mode-kp' },
                'imdb': { text: 'IMDB ID', class: 'mode-imdb' }
            };
            return labels[type] || labels['name'];
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.trim();
            const hint = document.getElementById('searchHint');
            if (!query) { hint.innerHTML = 'Например: Матрица, 251733 или tt0133093'; return; }
            const detected = detectSearchType(query);
            const label = getSearchModeLabel(detected.type);
            hint.innerHTML = 'Режим поиска: <span class="hint-type">' + label.text + '</span>';
        });

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') { document.body.classList.add('dark-theme'); updateThemeIcon(true); }
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
            } else {
                icon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        });

        initTheme();

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchMovie();
        });

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('searchHint').innerHTML = 'Например: Матрица, 251733 или tt0133093';
            document.getElementById('searchInput').focus();
        }

        async function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const detected = detectSearchType(query);
            const modeLabel = getSearchModeLabel(detected.type);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            try {
                let url, response, data;

                if (detected.type === 'name') {
                    url = API_BASE + '/v2/movies/name/list?name=' + encodeURIComponent(detected.value);
                    response = await fetch(url, { headers: { 'Authorization': 'Bearer ' + API_TOKEN, 'Accept': 'application/json' } });

                    if (response.ok) {
                        data = await response.json();
                        if (data.data && data.data.length > 0) displayResults(data.data, detected.type);
                        else document.getElementById('results').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);"><span class="search-mode-badge ' + modeLabel.class + '">' + modeLabel.text + '</span><div style="margin-top: 10px;">Ничего не найдено.</div></div>';
                    } else alert('Ошибка поиска.');
                } else {
                    const paramKey = detected.type;
                    url = API_BASE + '/v2/movies/search?' + paramKey + '=' + encodeURIComponent(detected.value);
                    response = await fetch(url, { headers: { 'Authorization': 'Bearer ' + API_TOKEN, 'Accept': 'application/json' } });

                    if (response.ok) {
                        data = await response.json();
                        if (data.data) displayResults([data.data], detected.type);
                        else document.getElementById('results').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);"><span class="search-mode-badge ' + modeLabel.class + '">' + modeLabel.text + '</span><div style="margin-top: 10px;">Фильм с ID <strong>' + detected.value + '</strong> не найден.</div></div>';
                    } else if (response.status === 404) {
                        document.getElementById('results').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);"><span class="search-mode-badge ' + modeLabel.class + '">' + modeLabel.text + '</span><div style="margin-top: 10px;">Фильм с ID <strong>' + detected.value + '</strong> не найден.</div></div>';
                    } else alert('Ошибка поиска.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Ошибка соединения с сервером');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayResults(movies, searchType) {
            const resultsDiv = document.getElementById('results');
            const modeLabel = getSearchModeLabel(searchType);
            
            let html = '<div style="margin-bottom: 15px;"><span class="search-mode-badge ' + modeLabel.class + '">' + modeLabel.text + '</span><span style="color: var(--text-secondary); font-size: 13px; margin-left: 10px;">Найдено: ' + movies.length + '</span></div>';

            movies.forEach(movie => {
                const year = movie.year || '';
                const country = movie.country || '';
                const genre = movie.genre || '';
                const rating = movie.rating?.kp || '-';
                const poster = movie.poster || '';
                const safeName = movie.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safePoster = poster ? poster.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
                
                html += '<div class="result-item" onclick="openMovie(\'' + movie.token + '\', \'' + safeName + '\', \'' + safePoster + '\', ' + (year || 'null') + ')">' + (poster ? '<div class="result-poster"><img src="' + poster + '" alt="' + movie.name + '"></div>' : '') + '<a href="#" class="result-title" onclick="event.preventDefault()">' + movie.name + '</a><div class="result-meta">' + (year ? year + ' г.' : '') + (country ? ' • ' + country : '') + (genre ? ' • ' + genre : '') + (rating !== '-' ? ' • Рейтинг KP: ' + rating : '') + '</div><div class="clear-float"></div></div>';
            });

            resultsDiv.innerHTML = html;
        }

        function openMovie(token, name, poster, year) {
            let history = JSON.parse(localStorage.getItem('movieHistory') || '[]');
            const existingIndex = history.findIndex(item => item.token === token);
            if (existingIndex !== -1) history.splice(existingIndex, 1);
            history.unshift({ token: token, name: name, poster: poster && poster.trim() !== '' ? poster : null, year: year, date: new Date().toISOString() });
            history = history.slice(0, 60);
            localStorage.setItem('movieHistory', JSON.stringify(history));
            window.open('result.html?token=' + token, '_blank');
        }
    </script>
</body>
</html>
