<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Просмотр фильма</title>
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.ico">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="favicons/favicon.ico">
    <meta name="theme-color" content="#4285f4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #202124;
            --text-secondary: #5f6368;
            --card-bg: #fff;
            --meta-bg: #f1f3f4;
            --meta-text: #202124;
            --border-color: #dfe1e5;
            --link-color: #1a0dab;
            --rating-kp: #ff6b00;
            --rating-imdb: #f5c518;
            --shadow-color: rgba(0,0,0,0.15);
        }

        body.dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #e8eaed;
            --text-secondary: #9aa0a6;
            --card-bg: #202124;
            --meta-bg: #303134;
            --meta-text: #e8eaed;
            --border-color: #3c4043;
            --link-color: #8ab4f8;
            --rating-kp: #ff6b00;
            --rating-imdb: #f5c518;
            --shadow-color: rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .top-buttons {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .icon-btn {
            background: #4285f4;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover { background: #3367d6; transform: scale(1.05); }
        .icon-btn svg { width: 24px; height: 24px; fill: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding-top: 60px; }

        .movie-header { display: flex; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; }
        .poster { flex-shrink: 0; }
        .poster img { width: 300px; border-radius: 8px; box-shadow: 0 4px 8px var(--shadow-color); }
        .info { flex: 1; min-width: 300px; }
        .title { font-size: 32px; margin-bottom: 10px; color: var(--text-color); }
        .original-title { font-size: 20px; color: var(--text-secondary); margin-bottom: 15px; }
        .meta { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .meta-item { background: var(--meta-bg); color: var(--meta-text); padding: 5px 15px; border-radius: 4px; font-size: 14px; }
        .rating { display: flex; gap: 15px; margin-bottom: 20px; }
        .rating-item { padding: 10px 20px; border-radius: 8px; font-weight: bold; }
        .kp { background: var(--rating-kp); color: #fff; }
        .imdb { background: var(--rating-imdb); color: #000; }
        .description { line-height: 1.6; margin-bottom: 20px; color: var(--text-secondary); }
        .credits { margin-bottom: 15px; color: var(--text-color); }
        .credits strong { display: inline-block; min-width: 100px; color: var(--text-color); }
        
        .player-container { 
            margin-top: 30px; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative;
            transition: all 0.3s;
        }
        .player-wrapper { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
        }
        .player-wrapper iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none;
        }
        
        .fullscreen-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: all 0.2s;
            padding: 0;
        }
        .fullscreen-btn:hover {
            background: rgba(0,0,0,0.9);
            border-color: #fff;
            transform: scale(1.1);
        }
        .fullscreen-btn:active {
            transform: scale(0.95);
        }
        .fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }
        
        @media (min-width: 769px) {
            .fullscreen-btn {
                display: none !important;
            }
        }
        
        /* ПОЛНЫЙ ЭКРАН */
        body.player-fullscreen {
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
            background: #000 !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            height: 100dvh !important;
            z-index: 999999 !important;
        }
        
        body.player-fullscreen .top-buttons,
        body.player-fullscreen .movie-header,
        body.player-fullscreen .comments-section {
            display: none !important;
        }
        
        body.player-fullscreen .container {
            padding: 0 !important;
            margin: 0 !important;
            max-width: 100% !important;
            width: 100% !important;
            height: 100% !important;
            height: 100dvh !important;
        }
        
        body.player-fullscreen #content {
            height: 100% !important;
        }
        
        body.player-fullscreen .player-container {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            border-radius: 0 !important;
            margin: 0 !important;
            z-index: 999999 !important;
            padding-top: env(safe-area-inset-top) !important;
        }
        
        body.player-fullscreen .player-wrapper {
            padding-bottom: 0 !important;
            height: 100% !important;
            width: 100% !important;
        }
        
        body.player-fullscreen .player-wrapper iframe {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Подсказка "Нажмите для выхода" - маленькая и ненавязчивая */
        .exit-hint {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000000;
            pointer-events: none;
            opacity: 0.7;
        }
        
        body.player-fullscreen .exit-hint {
            display: block;
            animation: fadeOut 3s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 0.7; }
            70% { opacity: 0.7; }
            100% { opacity: 0; }
        }
        
        .error { text-align: center; padding: 50px; font-size: 20px; color: #ff6b6b; }
        .loading { text-align: center; padding: 50px; font-size: 20px; color: var(--text-secondary); }
        
        .comments-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .comments-section h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--text-color);
        }
        #sigCommentsBlock {
            min-height: 200px;
        }

        @media (max-width: 768px) {
            body { padding: 15px; }
            .top-buttons { top: 15px; left: 15px; }
            .icon-btn { width: 45px; height: 45px; }
            .icon-btn svg { width: 20px; height: 20px; }
            .container { padding-top: 50px; }
            .movie-header { flex-direction: column; gap: 20px; }
            .poster img { width: 100%; max-width: 300px; margin: 0 auto; display: block; }
            .info { min-width: 100%; }
            .title { font-size: 24px; }
            .original-title { font-size: 18px; }
            .meta-item { font-size: 12px; padding: 4px 10px; }
            .rating-item { padding: 8px 15px; font-size: 14px; }
            .description { font-size: 14px; }
            .credits { font-size: 14px; }
            .credits strong { display: block; min-width: auto; margin-bottom: 5px; }
            .player-container { margin-top: 20px; }
            .comments-section h2 { font-size: 20px; }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .top-buttons { top: 10px; left: 10px; }
            .icon-btn { width: 40px; height: 40px; }
            .icon-btn svg { width: 18px; height: 18px; }
            .container { padding-top: 45px; }
            .title { font-size: 20px; }
            .original-title { font-size: 16px; }
            .meta { gap: 10px; }
            .meta-item { font-size: 11px; padding: 3px 8px; }
            .rating { gap: 10px; }
            .rating-item { padding: 6px 12px; font-size: 12px; }
            .description { font-size: 13px; }
            .credits { font-size: 13px; }
            .comments-section h2 { font-size: 18px; }
            .fullscreen-btn { width: 44px; height: 44px; }
            .fullscreen-btn svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>
    <div class="top-buttons">
        <a href="index.html" class="icon-btn" title="На главную">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <button class="icon-btn" id="themeToggle" title="Переключить тему">
            <svg id="themeIcon" viewBox="0 0 24 24">
                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
        </button>
    </div>

    <div class="container">
        <div id="content">
            <div class="loading">Загрузка...</div>
        </div>
        
        <div class="comments-section" id="comments-section" style="display: none;">
            <h2>💬 Обсуждение</h2>
            
            <div id="sigCommentsBlock"></div>
            <a href="https://sigcomments.com" style="font-size: 0.6em; color: var(--text-secondary); text-decoration: none; display: block; margin-top: 10px; text-align: center;">Система комментирования SigComments</a>
            
            <script type="text/javascript">
                (function(){
                    var host_id = '8338';
                    var script = document.createElement('script');
                    script.type = 'text/javascript';
                    script.async = true;
                    script.src = '//sigcomments.com/chat/?host_id='+host_id;
                    var ss = document.getElementsByTagName('script')[0]; 
                    ss.parentNode.insertBefore(script, ss);
                })();
            </script>
        </div>
    </div>

    <!-- Маленькая подсказка "Нажмите для выхода" -->
    <div class="exit-hint" id="exit-hint">Нажмите для выхода</div>

    <script>
        const API_TOKEN = '31bc371dadca00f9f9475a36967d00';
        const API_BASE = 'https://apbugall.org';

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                updateThemeIcon(true);
            }
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
            } else {
                icon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        });

        initTheme();

        function getUrlParameter(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        async function loadMovie() {
            const token = getUrlParameter('token');
            if (!token) {
                document.getElementById('content').innerHTML = '<div class="error">Фильм не указан</div>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/v2/movies/token/${token}`, {
                    headers: {
                        'Authorization': `Bearer ${API_TOKEN}`,
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.data) {
                        renderMovie(data.data);
                        document.getElementById('comments-section').style.display = 'block';
                    } else {
                        document.getElementById('content').innerHTML = '<div class="error">Фильм не найден</div>';
                    }
                } else {
                    document.getElementById('content').innerHTML = '<div class="error">Ошибка загрузки данных</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('content').innerHTML = '<div class="error">Ошибка соединения</div>';
            }
        }

        function toArray(value) {
            if (!value) return [];
            if (Array.isArray(value)) return value;
            if (typeof value === 'string') return [value];
            return [];
        }

        function renderMovie(movie) {
            const container = document.getElementById('content');
            const directors = toArray(movie.credits?.directors);
            const actors = toArray(movie.credits?.actors);
            const producers = toArray(movie.credits?.producers);
            const iframe = movie.iframe || (movie.translations && movie.translations[0] ? movie.translations[0].iframe : '');

            container.innerHTML = `
                <div class="movie-header">
                    <div class="poster">
                        <img src="${movie.poster || 'https://placehold.co/300x450/1a2736/ffffff?text=No+Poster'}" 
                             alt="${movie.name}"
                             onerror="this.src='https://placehold.co/300x450/1a2736/ffffff?text=No+Poster'">
                    </div>
                    <div class="info">
                        <h1 class="title">${movie.name}</h1>
                        ${movie.original_name ? `<div class="original-title">${movie.original_name}</div>` : ''}
                        <div class="meta">
                            ${movie.year ? `<span class="meta-item">${movie.year}</span>` : ''}
                            ${movie.category?.name ? `<span class="meta-item">${movie.category.name}</span>` : ''}
                            ${movie.country ? `<span class="meta-item">${movie.country}</span>` : ''}
                            ${movie.genre ? `<span class="meta-item">${movie.genre}</span>` : ''}
                        </div>
                        ${movie.rating ? `
                        <div class="rating">
                            ${movie.rating.kp ? `<div class="rating-item kp">KP: ${movie.rating.kp}</div>` : ''}
                            ${movie.rating.imdb ? `<div class="rating-item imdb">IMDB: ${movie.rating.imdb}</div>` : ''}
                        </div>` : ''}
                        ${movie.description ? `<div class="description">${movie.description}</div>` : ''}
                        <div class="credits">
                            ${directors.length > 0 ? `<div><strong>Режиссер:</strong> ${directors.join(', ')}</div>` : ''}
                            ${actors.length > 0 ? `<div><strong>В ролях:</strong> ${actors.slice(0, 10).join(', ')}${actors.length > 10 ? '...' : ''}</div>` : ''}
                            ${producers.length > 0 ? `<div><strong>Продюсер:</strong> ${producers.join(', ')}</div>` : ''}
                        </div>
                        ${movie.runtime ? `<div><strong>Продолжительность:</strong> ${movie.runtime}</div>` : ''}
                        ${movie.premiere?.ru ? `<div><strong>Премьера (РФ):</strong> ${movie.premiere.ru}</div>` : ''}
                    </div>
                </div>
                ${iframe ? `
                <div class="player-container" id="player-container">
                    <div class="player-wrapper">
                        <iframe 
                            src="${iframe}" 
                            allowfullscreen
                            webkitallowfullscreen
                            mozallowfullscreen
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                            id="movie-player"
                        ></iframe>
                    </div>
                    <button class="fullscreen-btn" id="fullscreen-btn" title="На весь экран">
                        <svg viewBox="0 0 24 24">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                    </button>
                </div>` : '<div style="padding: 20px; text-align: center; color: #ff6b6b;">Плеер недоступен</div>'}
            `;
            
            if (iframe) {
                setTimeout(() => {
                    const fullscreenBtn = document.getElementById('fullscreen-btn');
                    
                    if (fullscreenBtn) {
                        fullscreenBtn.addEventListener('click', enterFullscreen);
                    }
                }, 100);
            }
        }

        // Вход в полный экран + поворот в ландшафт
        function enterFullscreen() {
            const docEl = document.documentElement;
            
            // Пробуем настоящий Fullscreen API
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => {});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) {
                docEl.msRequestFullscreen();
            }
            
            // Применяем CSS для надёжности
            setTimeout(() => {
                applyCSSFullscreen();
            }, 100);
            
            // Блокируем ориентацию в ландшафт (если поддерживается)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {
                    console.log('Не удалось заблокировать ориентацию');
                });
            }
            
            console.log('✓ Вошли в полный экран');
        }

        function applyCSSFullscreen() {
            document.body.classList.add('player-fullscreen');
            document.body.style.overflow = 'hidden';
            document.documentElement.style.overflow = 'hidden';
        }

        // Выход из полного экрана
        function exitFullscreen() {
            // Выход из настоящего Fullscreen API
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
            
            // Убираем CSS
            document.body.classList.remove('player-fullscreen');
            document.body.style.overflow = '';
            document.documentElement.style.overflow = '';
            
            // Разблокируем ориентацию
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
            
            console.log('✓ Вышли из полного экрана');
        }

        //  Выход по нажатию на экран (тап)
        document.addEventListener('click', function(e) {
            // Проверяем, что мы в режиме полного экрана
            if (document.body.classList.contains('player-fullscreen')) {
                // Не выходим, если кликнули по кнопке полноэкранного режима (она скрыта, но на всякий случай)
                if (e.target.closest('.fullscreen-btn')) return;
                
                exitFullscreen();
            }
        });

        // Также обрабатываем touchend для мобильных
        document.addEventListener('touchend', function(e) {
            if (document.body.classList.contains('player-fullscreen')) {
                if (e.target.closest('.fullscreen-btn')) return;
                
                // Небольшая задержка, чтобы не конфликтовать с кликом
                setTimeout(() => {
                    if (document.body.classList.contains('player-fullscreen')) {
                        exitFullscreen();
                    }
                }, 100);
            }
        });

        // Обработка кнопки "Назад" на Android
        window.addEventListener('popstate', function() {
            if (document.body.classList.contains('player-fullscreen')) {
                exitFullscreen();
            }
        });

        // Обработка Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.body.classList.contains('player-fullscreen')) {
                exitFullscreen();
            }
        });

        // Обработка системного выхода из fullscreen
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        function handleFullscreenChange() {
            if (!document.fullscreenElement && 
                !document.webkitFullscreenElement && 
                !document.mozFullScreenElement &&
                !document.msFullscreenElement) {
                document.body.classList.remove('player-fullscreen');
                document.body.style.overflow = '';
                document.documentElement.style.overflow = '';
                
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        }

        loadMovie();
    </script>
</body>
</html>
