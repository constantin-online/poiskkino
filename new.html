<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новинки</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    <link rel="shortcut icon" href="favicons/favicon.ico">
    <meta name="theme-color" content="#4285f4">
    
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #202124;
            --text-secondary: #5f6368;
            --border-color: #dfe1e5;
            --hover-bg: #f8f9fa;
            --link-color: #1a0dab;
            --btn-bg: #f8f9fa;
            --btn-border: #f8f9fa;
            --btn-hover-border: #dadce0;
            --shadow-color: rgba(32, 33, 36, 0.28);
            --card-bg: #fff;
            --card-shadow: rgba(0,0,0,0.15);
        }

        body.dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #e8eaed;
            --text-secondary: #9aa0a6;
            --border-color: #3c4043;
            --hover-bg: #2a2a2a;
            --link-color: #8ab4f8;
            --btn-bg: #303134;
            --btn-border: #303134;
            --btn-hover-border: #5f6368;
            --shadow-color: rgba(0,0,0,0.5);
            --card-bg: #202124;
            --card-shadow: rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        .top-buttons { position: fixed; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 1000; }

        .icon-btn {
            background: #4285f4; color: #fff; border: none; border-radius: 50%;
            width: 50px; height: 50px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover { background: #3367d6; transform: scale(1.05); }
        .icon-btn svg { width: 24px; height: 24px; fill: #fff; }

        .nav-menu { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 1000; flex-wrap: wrap; }

        .nav-link {
            background: var(--btn-bg); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 8px 16px; text-decoration: none; font-size: 14px;
            transition: all 0.2s;
        }

        .nav-link:hover { background: var(--hover-bg); border-color: var(--btn-hover-border); }

        .container { max-width: 1400px; margin: 0 auto; padding-top: 80px; }

        h1 { color: var(--text-color); font-size: 32px; margin-bottom: 10px; padding-left: 60px; }
        .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; padding-left: 60px; }

        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }

        .movie-card {
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 12px; overflow: hidden;
            background: var(--card-bg); box-shadow: 0 2px 8px var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .movie-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px var(--card-shadow); }

        .movie-poster { width: 100%; aspect-ratio: 2/3; overflow: hidden; background: var(--hover-bg); }
        .movie-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .movie-info { padding: 12px; }

        .movie-title {
            color: var(--link-color); font-size: 14px; font-weight: bold;
            margin-bottom: 6px; line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }

        .movie-title:hover { text-decoration: underline; }
        .movie-meta { color: var(--text-secondary); font-size: 12px; line-height: 1.4; }

        .movie-rating {
            display: inline-block; background: #ff6b00; color: #fff;
            padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold;
            margin-top: 6px;
        }

        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 40px; padding-bottom: 40px; }

        .page-btn {
            background: var(--btn-bg); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 4px;
            padding: 8px 16px; cursor: pointer; font-size: 14px;
            text-decoration: none; transition: all 0.2s;
        }

        .page-btn:hover { background: var(--hover-bg); border-color: var(--btn-hover-border); }
        .page-btn.active { background: #4285f4; color: #fff; border-color: #4285f4; }

        .loading { text-align: center; padding: 50px; color: var(--text-secondary); font-size: 18px; }
        .error { text-align: center; padding: 50px; color: #ff6b6b; font-size: 18px; }
        .no-poster { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 12px; text-align: center; padding: 10px; }

        @media (max-width: 768px) {
            .top-buttons { top: 15px; left: 15px; }
            .icon-btn { width: 45px; height: 45px; }
            .icon-btn svg { width: 20px; height: 20px; }
            .nav-menu { top: 75px; right: 15px; }
            .nav-link { font-size: 12px; padding: 6px 12px; }
            .container { padding-top: 130px; }
            h1 { font-size: 24px; padding-left: 50px; }
            .subtitle { padding-left: 50px; }
            .movies-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        }

        @media (max-width: 480px) {
            .top-buttons { top: 10px; left: 10px; }
            .icon-btn { width: 40px; height: 40px; }
            .icon-btn svg { width: 18px; height: 18px; }
            .nav-menu { top: 60px; right: 10px; gap: 6px; }
            .nav-link { font-size: 11px; padding: 5px 10px; }
            .container { padding-top: 120px; }
            h1 { font-size: 20px; padding-left: 45px; }
            .subtitle { padding-left: 45px; }
            .movies-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .movie-info { padding: 8px; }
            .movie-title { font-size: 12px; }
            .movie-meta { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="top-buttons">
        <a href="index.html" class="icon-btn" title="На главную">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <button class="icon-btn" id="themeToggle" title="Переключить тему">
            <svg id="themeIcon" viewBox="0 0 24 24">
                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
        </button>
    </div>

    <div class="nav-menu">
        <a href="new.html" class="nav-link">🔥 Новинки</a>
        <a href="categories.html" class="nav-link">📂 Категории</a>
    </div>

    <div class="container">
        <h1> Новинки</h1>
        <div class="subtitle">Последние фильмы по дате релиза</div>
        <div class="movies-grid" id="moviesGrid">
            <div class="loading">Загрузка...</div>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        const API_TOKEN = '31bc371dadca00f9f9475a36967d00';
        const API_BASE = 'https://apbugall.org';

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') { document.body.classList.add('dark-theme'); updateThemeIcon(true); }
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
            } else {
                icon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        });

        initTheme();

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        async function loadMovies(page) {
            page = page || 1;
            const grid = document.getElementById('moviesGrid');
            const pagination = document.getElementById('pagination');
            grid.innerHTML = '<div class="loading">Загрузка...</div>';
            pagination.innerHTML = '';

            try {
                const response = await fetch(API_BASE + '/v2/movies?page=' + page + '&order=date&order_dir=desc', {
                    headers: { 'Authorization': 'Bearer ' + API_TOKEN, 'Accept': 'application/json' }
                });

                if (!response.ok) throw new Error('Ошибка загрузки');

                const data = await response.json();
                renderMovies(data.data || []);
                renderPagination(data.meta, data.links);
            } catch (error) {
                console.error('Error:', error);
                grid.innerHTML = '<div class="error">Ошибка загрузки. Попробуйте позже.</div>';
            }
        }

        function renderMovies(movies) {
            const grid = document.getElementById('moviesGrid');
            
            if (movies.length === 0) {
                grid.innerHTML = '<div class="error">Ничего не найдено</div>';
                return;
            }

            let html = '';
            movies.forEach(movie => {
                const year = movie.year || '';
                const country = movie.country || '';
                const genre = movie.genre || '';
                const rating = movie.rating?.kp || null;
                const poster = movie.poster || '';
                const safeName = movie.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safePoster = poster ? poster.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';

                html += '<div class="movie-card" onclick="openMovie(\'' + movie.token + '\', \'' + safeName + '\', \'' + safePoster + '\', ' + (year || 'null') + ')"><div class="movie-poster">' + (poster ? '<img src="' + poster + '" alt="' + movie.name + '" onerror="this.parentElement.innerHTML=\'<div class=\\\'no-poster\\\'>Нет постера</div>\'">' : '<div class="no-poster">Нет постера</div>') + '</div><div class="movie-info"><div class="movie-title">' + movie.name + '</div><div class="movie-meta">' + (year ? year + ' г.' : '') + (country ? ' • ' + country : '') + (genre ? ' • ' + genre : '') + '</div>' + (rating ? '<div class="movie-rating">KP: ' + rating + '</div>' : '') + '</div></div>';
            });

            grid.innerHTML = html;
        }

        function renderPagination(meta, links) {
            const pagination = document.getElementById('pagination');
            if (!meta) return;

            let html = '';
            
            if (links.prev) {
                const prevPage = meta.current_page - 1;
                html += '<a href="?page=' + prevPage + '" class="page-btn">← Назад</a>';
            }

            const totalPages = Math.min(meta.current_page + 2, 10);
            const startPage = Math.max(1, meta.current_page - 2);

            for (let i = startPage; i <= totalPages; i++) {
                html += '<a href="?page=' + i + '" class="page-btn ' + (i === meta.current_page ? 'active' : '') + '">' + i + '</a>';
            }

            if (meta.has_more) {
                const nextPage = meta.current_page + 1;
                html += '<a href="?page=' + nextPage + '" class="page-btn">Вперёд →</a>';
            }

            pagination.innerHTML = html;
        }

        function openMovie(token, name, poster, year) {
            let history = JSON.parse(localStorage.getItem('movieHistory') || '[]');
            const existingIndex = history.findIndex(item => item.token === token);
            if (existingIndex !== -1) history.splice(existingIndex, 1);
            history.unshift({ token: token, name: name, poster: poster && poster.trim() !== '' ? poster : null, year: year, date: new Date().toISOString() });
            history = history.slice(0, 60);
            localStorage.setItem('movieHistory', JSON.stringify(history));
            window.open('result.html?token=' + token, '_blank');
        }

        const currentPage = parseInt(getUrlParam('page')) || 1;
        loadMovies(currentPage);
    </script>
</body>
</html>
